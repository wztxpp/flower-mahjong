<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Local presentation QA</title><style>#qa{position:fixed;z-index:100;bottom:8px;left:8px;background:white;color:#223;padding:8px;max-width:95vw;border:1px solid #888;font:12px sans-serif}#qa button{margin:3px;padding:6px}#result{max-width:85vw;white-space:pre-wrap;max-height:150px;overflow:auto}</style></head><body><div id="app"></div><div id="qa"><strong>Synthetic local presentation QA</strong><button id="reset">Reset</button><button id="win">Discard win</button><button id="double">Two winners</button><button id="benchmark">Benchmark</button><pre id="result">Loading…</pre></div><script type="module">
import {createApp,nextTick} from 'vue';
import App from '../../src/App.vue';
import '../../src/style.css';
import '../../src/tabletop.css';
const realFetch=window.fetch.bind(window);
// Never contacts an actual game or persists a server-side room.
window.fetch=async (url,options)=>String(url).startsWith('/api/') ? new Response(JSON.stringify(String(url).includes('/profile/history') ? {summary:{settledGames:0,totalScore:0},records:[]} : String(url).includes('/profile') ? {playerToken:'a'.repeat(64)} : {unchanged:true,connections:[true,true,true]}),{headers:{'content-type':'application/json'}}) : realFetch(url,options);
const app=createApp(App); app.mount('#app');
await nextTick();
const scope=app._instance.setupState;
const initial=()=>({id:'ABCDEF23',revision:1,you:0,hostSeat:0,phase:'playing',tableScores:[0,1,2].map(seat=>({id:`player-${seat+1}`,name:['测试甲','测试乙','测试丙'][seat],seat,totalScore:[12,-7,-5][seat],settledScore:[12,-7,-5][seat],provisionalScore:0,detached:false})),seats:[0,1,2].map(seat=>({seat,name:['测试甲','测试乙','测试丙'][seat],connected:true})),game:{id:'visual-fixture',schemaVersion:3,phase:'turn',turnStep:'discard',currentSeat:0,drawnTile:3,wallCount:42,characters:['sweet','elegant','sunny'],rules:{autoDiscardAfterHu:true,specialHuPatterns:true,allowPungUpgrade:false,turnDirection:'counterclockwise'},players:[0,1,2].map(seat=>({seat,handCount:13,hand:seat===0?[0,1,2,3,4,4,5,9,10,11,12,13,14,17]:undefined,huCount:0,score:0,melds:[],radishes:[],winPile:[]})),discards:Array.from({length:60},(_,index)=>({seat:index%3,tile:index%18})),history:[],sharedRadishes:[1,2,3,6,8,12],firstHuRadishesRevealed:true,legalActions:[{type:'discard',tile:0},{type:'discard',tile:4}],huDiagnostic:{canHu:false,message:'合成测试牌局'},waitTiles:[]}});
let snapshot;
function reset(){scope.resetRoomContext();scope.session={roomId:'ABCDEF23',token:'b'.repeat(64)};snapshot=initial();scope.applyState(structuredClone(snapshot));document.querySelector('#result').textContent='Ready. Synthetic private hand only; no backend writes.';}
function win(double){snapshot=structuredClone(snapshot);snapshot.revision++;const index=snapshot.game.discards.length; snapshot.game.discards.push({seat:0,tile:4,huSeats:double?[2,1]:[2]}); for(const seat of double?[2,1]:[2]){snapshot.game.history.push({type:'hu',seat,tile:4,source:'discard',fromSeat:0});snapshot.game.players[seat].huCount++;snapshot.game.players[seat].winPile.push({tile:4,source:'discard',discardIndex:index,virtual:double&&seat===1});}scope.applyState(structuredClone(snapshot));document.querySelector('#result').textContent='Committed win applied. Current legal actions remain enabled.';}
function summary(values){values.sort((a,b)=>a-b);return {samples:values.length,p50:+values[Math.floor(values.length*.5)].toFixed(3),p95:+values[Math.floor(values.length*.95)].toFixed(3),max:+values.at(-1).toFixed(3)}}
async function benchmark(){reset();await nextTick();const selection=[],updates=[];for(let i=0;i<220;i++){const started=performance.now();scope.selectHand(i%2?0:4,i%2?0:4);await nextTick();if(i>=20)selection.push(performance.now()-started);}for(let i=0;i<100;i++){const next=structuredClone(snapshot);next.revision++;snapshot=next;const started=performance.now();scope.applyState(next);await nextTick();if(i>=20)updates.push(performance.now()-started);}document.querySelector('#result').textContent=JSON.stringify({method:'Same-browser Vue dev build, 60 river tiles; state->nextTick DOM patch only, excludes paint/network; 20 warmups per scenario',selectionMs:summary(selection),snapshotMs:summary(updates),tileElements:document.querySelectorAll('.mahjong-tile').length},null,2);}
document.querySelector('#reset').onclick=reset;document.querySelector('#win').onclick=()=>win(false);document.querySelector('#double').onclick=()=>win(true);document.querySelector('#benchmark').onclick=benchmark;reset();
</script></body></html>

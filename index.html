<!doctype html>
<!-- 浏览器入口：只提供元信息与 Vue 挂载点，游戏界面由 src/App.vue 渲染。
     Browser entry: metadata and the Vue mount point; src/App.vue renders the game UI. -->
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 手机以设备宽度排版，viewport-fit 让 CSS 安全区适配刘海屏。
         Use device width on phones; viewport-fit enables CSS safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#123c32" />
    <meta name="description" content="自贡花麻将，三人同桌，熟悉的条筒。一个安静、轻盈的在线麻将原型，仅使用虚拟积分。" />
    <title>花间 · 自贡花麻将</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='20' fill='%23123c32'/%3E%3Cpath d='M40 16c11 0 9 14 9 14s14-2 14 9-14 9-14 9 2 14-9 14-9-14-9-14-14 2-14-9 14-9 14-9-2-14 9-14' fill='none' stroke='%23e7d4a0' stroke-width='3'/%3E%3Ccircle cx='40' cy='39' r='5' fill='%23e7d4a0'/%3E%3C/svg%3E" />
  </head>
  <body>
    <!-- main.js 会把 Vue 应用挂载到这个唯一容器，不要随意改 id。
         main.js mounts Vue into this unique container; preserve its id. -->
    <div id="app"></div>
    <!-- 模块脚本是 Vite 的源码入口；生产构建会替换为带哈希的资源路径。
         Vite builds this module entry into hashed production assets. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
